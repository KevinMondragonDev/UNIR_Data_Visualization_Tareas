<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard de ventas · Smartphones y tablets</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body class="bg-body-tertiary">
  <div class="container-xl py-4">

    <header class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-2">
      <div>
        <h1 class="h3 fw-bold mb-1">Desempeño de productos</h1>
        <p class="small text-body-secondary mb-0">
          Ventas, ingresos y precio por producto y mes · fuente: <code>ventas.json</code>
        </p>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" role="switch" id="auto-actualizar">
          <label class="form-check-label small text-body-secondary" for="auto-actualizar">
            Auto cada <span id="intervalo-seg">30</span> s
          </label>
        </div>
        <button id="btn-actualizar" type="button" class="btn btn-primary fw-semibold px-4">Actualizar</button>
      </div>
    </header>

    <p id="estado" class="small text-body-secondary mb-3" role="status">Cargando datos…</p>

    <section id="kpis" class="row row-cols-2 row-cols-lg-4 g-3 mb-3" aria-label="Indicadores principales"></section>

    <main class="row g-3">
      <div class="col-12 col-lg-6">
        <article class="card h-100 shadow-sm">
          <div class="card-body">
            <h2 class="h6 fw-bold mb-1">Ventas mensuales por producto</h2>
            <p class="small text-body-secondary mb-2">Google Charts · gráfico de columnas</p>
            <div id="leyenda-columnas" class="leyenda" hidden></div>
            <div id="grafico-columnas" style="width: 100%; height: 380px;"></div>
          </div>
        </article>
      </div>

      <div class="col-12 col-lg-6">
        <article class="card h-100 shadow-sm">
          <div class="card-body">
            <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
              <div>
                <h2 class="h6 fw-bold mb-1">Análisis multidimensional</h2>
                <p class="small text-body-secondary mb-0" id="nota-burbujas">D3.js · X = mes, color = producto, Y = ventas, tamaño = ingresos</p>
              </div>
              <div>
                <label for="metrica-y" class="form-label small text-body-secondary mb-1">Eje Y</label>
                <select id="metrica-y" class="form-select form-select-sm">
                  <option value="ventas">Ventas (unidades)</option>
                  <option value="ingresos">Ingresos ($)</option>
                </select>
              </div>
            </div>
            <div id="grafico-burbujas"></div>
            <div id="leyenda" class="leyenda"></div>
          </div>
        </article>
      </div>
    </main>

  </div>

  <div id="tooltip" class="tooltip-grafico" hidden></div>
</body>
</html>
